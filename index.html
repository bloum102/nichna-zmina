<style>
:root{
  --night:#12262E; --panel:#1B3540; --panel2:#22414D; --ink:#E9F1F2; --muted:#A5BCC1;
  --call:#F2B544; --callInk:#2A1F05; --ok:#6FD6A8; --alert:#EE7A6F; --line:#2F5562;
  --paper:#EDF3F1; --paperInk:#15303A; --grid:#D3E0DC;
  --display:'Unbounded', 'Arial Black', Arial, sans-serif;
  --text:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:20px 20px 40px;min-height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.lamp{width:12px;height:12px;border-radius:50%;background:var(--call);box-shadow:0 0 0 4px rgba(242,181,68,.18)}
.brand{font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.3px;color:var(--muted)}
.steps{margin-left:auto;display:flex;gap:4px}
.steps i{display:block;width:18px;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--call)}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.12;margin-bottom:16px}
h2{font-family:var(--display);font-weight:500;font-size:23px;line-height:1.2;margin-bottom:12px}
p{margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:14px}
.screen{flex:1;display:flex;flex-direction:column}
.screen>.grow{flex:1}
.btn{appearance:none;border:0;border-radius:14px;background:var(--call);color:var(--callInk);font:600 17px var(--text);
  padding:16px 20px;width:100%;cursor:pointer;margin-top:18px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:focus-visible,.opt:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.box{background:var(--panel);border-radius:16px;padding:18px;margin:10px 0}
.list{margin:6px 0 0 20px}
.list li{margin-bottom:6px}
/* таймер */
.timer{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>b{display:block;height:100%;width:100%;background:var(--call);transform-origin:left;transition:transform .25s linear}
.bar.hot>b{background:var(--alert)}
.secs{font-family:var(--display);font-size:18px;min-width:56px;text-align:right}
/* картка пацієнта */
.chart{background:var(--paper);color:var(--paperInk);border-radius:6px 6px 14px 14px;padding:18px 18px 16px;position:relative;
  border-top:8px solid var(--call)}
.chart h3{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.2px;margin-bottom:10px;color:#35535C}
.chart dl{display:grid;grid-template-columns:104px 1fr;gap:0 12px;font-size:16px;line-height:1.5}
.chart dt,.chart dd{padding:6px 0;border-bottom:1px solid var(--grid)}
.chart dt{color:#4F6C74}
.chart dd{font-weight:500}
.chart .extra{margin-top:10px;padding-top:8px;border-top:1px dashed #9FB7B1;font-size:15px;color:#4F6C74}
.gone{animation:gone .6s ease forwards}
@keyframes gone{to{opacity:0;filter:blur(6px)}}
/* месенджер */
.chat{background:var(--panel);border-radius:18px;overflow:hidden;margin-top:6px}
.chat .head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--panel2)}
.ava{width:34px;height:34px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:600;font-size:14px}
.chat .head b{display:block;font-size:15px}
.chat .head span{font-size:13px;color:var(--ok)}
textarea{width:100%;min-height:170px;border:0;resize:vertical;background:var(--panel);color:var(--ink);font:400 17px/1.5 var(--text);padding:16px}
textarea::placeholder{color:#7F9AA0}
.sbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 8px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;font-size:12.5px;line-height:1.25;color:var(--muted)}
.chip b{display:block;font-family:var(--display);font-size:18px;color:var(--call);margin-bottom:2px}
.linkbtn{background:none;border:0;color:var(--call);font:500 15px var(--text);text-decoration:underline;cursor:pointer;padding:6px 0}
/* повідомлення для лікаря */
.bubble{background:var(--panel2);border-radius:4px 18px 18px 18px;padding:14px 16px;margin:8px 0 16px;font-size:16.5px;white-space:pre-line}
.from{font-size:13px;color:var(--muted);margin-top:6px}
.q{margin:16px 0 6px;font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px;font:400 16px var(--text);cursor:pointer}
.opt.sel{border-color:var(--call);background:#2B3F33}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale .opt{text-align:center;padding:12px 0;font-weight:600}
.walk{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
.walk .big{font-family:var(--display);font-size:64px;font-weight:700;color:var(--call);margin:10px 0}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.res div{background:var(--panel);border-radius:14px;padding:14px}
.res b{display:block;font-family:var(--display);font-size:28px;color:var(--call);line-height:1.2}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);
  padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.gone{animation:none;opacity:0}.bar>b{transition:none}}
@media (max-width:380px){h1{font-size:28px}.chart dl{grid-template-columns:88px 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="lamp" aria-hidden="true"></span><span class="brand">Нічна зміна</span><span class="steps" id="steps" aria-hidden="true"></span></div>
  <main id="app" class="screen" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===================== ДАНІ СЦЕНАРІЮ ===================== */
const CASES = {
  A: {
    title: "Історія хвороби · Хірургічне відділення",
    rows: [["Пацієнт","Петренко Іван Степанович, 58 років"],["Палата","4"],["Стан","2-га доба після апендектомії"],
           ["Зараз","температура 38,7 °C, пульс 112 уд/хв, скаржиться, що біль у животі посилився"],
           ["Зроблено","о 21:00 дали жарознижувальне за призначенням"],["Потрібно","щоб лікар оглянув пацієнта протягом 20 хвилин"]],
    extra: "Увечері приходила дружина. Просив ще одну подушку. Погано спав минулої ночі.",
    facts: [["прізвище",/петренк/],["палата 4",/(палат\S*\s*№?\s*4(?!\d))|((^|[^\d])4\s*-?\s*(а|й|та)?\s*палат)|четверт/],
            ["апендектомія",/апенд/],["температура 38,7",/38\s*[.,]\s*7/],["пульс 112",/112/],
            ["біль посилився",/бол|біл/],["жарознижувальне о 21:00",/жарознижу|парацетамол|ібупроф|21\s*[:.]\s*00|о\s*21/],
            ["оглянути протягом 20 хв",/20\s*(хв|мин|min)|двадцят/]]
  },
  B: {
    title: "Історія хвороби · Терапевтичне відділення",
    rows: [["Пацієнтка","Коваленко Ганна Петрівна, 64 роки"],["Палата","7"],["Стан","госпіталізована вчора з гіпертонічною хворобою"],
           ["Зараз","тиск 190/110 мм рт. ст., пульс 96 уд/хв, скаржиться на сильний головний біль і нудоту"],
           ["Зроблено","о 22:00 отримала вечірні ліки за призначенням"],["Потрібно","щоб лікар оглянув пацієнтку протягом 15 хвилин"]],
    extra: "Двічі телефонувала дочка. Просила зачинити вікно. Не доїла вечерю.",
    facts: [["прізвище",/коваленк/],["палата 7",/(палат\S*\s*№?\s*7(?!\d))|((^|[^\d])7\s*-?\s*(а|й|ма)?\s*палат)|сьом/],
            ["гіпертонічна хвороба",/гіпертон|гипертон/],["тиск 190/110",/190\s*(\/|на|\\)?\s*110/],["пульс 96",/(^|[^\d])96(?!\d)/],
            ["головний біль / нудота",/голов\S*\s*бол|голов\S*\s*біл|болить\s*голов|нудот|нудить/],["ліки о 22:00",/лік|таблет|22\s*[:.]\s*00|о\s*22/],
            ["оглянути протягом 15 хв",/15\s*(хв|мин|min)|п.?ятнадцят/]]
  }
};
const DOC = {
  C: {
    nurse: "Медсестра, терапевтичне відділення",
    free: "Добрий вечір, тут у другій бабуся з пневмонією, щось задихається, сатурація впала, ніби десь під 90. Може, глянете, коли будете вільні?",
    sbar: "Добрий вечір, Ірино Василівно. Це медсестра терапевтичного відділення.\nS: пацієнтка Мельник, 78 років, палата 2, у неї з’явилася задишка.\nB: госпіталізована з пневмонією, третю добу отримує антибіотик.\nA: сатурація зараз 89 %, увечері була 95 %. Вважаю, що стан погіршується.\nR: прошу оглянути пацієнтку протягом 10 хвилин.",
    qs: [
      ["У якій палаті пацієнтка?",["1","2","4","7"],1],
      ["Яка в неї сатурація зараз?",["89 %","92 %","95 %","У повідомленні точно не сказано"],{free:3,sbar:0}],
      ["Що від вас просять?",["Оглянути пацієнтку","Призначити інший антибіотик","Перевести в реанімацію","Незрозуміло, що саме"],0],
      ["Наскільки це терміново?",["Протягом 10 хвилин","Протягом години","Можна до ранку","У повідомленні не сказано"],{free:3,sbar:0}]
    ]
  },
  D: {
    nurse: "Медсестра, ендокринологічне відділення",
    free: "Алло, це ендокринологія. У п’ятій діабетик щось млявий, спітнілий, цукор низький. Я дала чай. Підійдете потім?",
    sbar: "Добрий вечір, Олеже Миколайовичу. Це медсестра ендокринологічного відділення.\nS: пацієнт Бондар, 45 років, палата 5, він пітливий і сонливий.\nB: госпіталізований з цукровим діабетом, отримує інсулін.\nA: глюкоза 3,1 ммоль/л, я дала йому солодкий чай. Вважаю, що це гіпоглікемія.\nR: прошу оглянути пацієнта протягом 15 хвилин.",
    qs: [
      ["У якій палаті пацієнт?",["3","5","6","8"],1],
      ["Яка в нього глюкоза зараз?",["3,1 ммоль/л","5,4 ммоль/л","7,8 ммоль/л","У повідомленні точно не сказано"],{free:3,sbar:0}],
      ["Що медсестра вже зробила?",["Дала солодкий чай","Ввела інсулін","Нічого не робила","Незрозуміло"],0],
      ["Наскільки це терміново?",["Протягом 15 хвилин","Протягом години","Можна до ранку","У повідомленні не сказано"],{free:3,sbar:0}]
    ]
  }
};

/* ===================== СТАН ===================== */
const qs = new URLSearchParams(location.search);
const FAST = qs.has("fast");
const READ_SEC = FAST ? 3 : 45, WALK_SEC = FAST ? 1 : 8, WRITE_SEC = FAST ? 20 : 180;
const pid = Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const first = Math.random() < .5 ? "A" : "B";
const second = first === "A" ? "B" : "A";
const cFree = Math.random() < .5;                // C отримує вільне повідомлення?
const docOrder = Math.random() < .5 ? ["C","D"] : ["D","C"];
const data = {
  v: 1, pid, test: qs.has("test") || FAST, repeat: false, started: new Date().toISOString(),
  ua: /Mobi|Android|iPhone/i.test(navigator.userAgent) ? "mobile" : "desktop",
  r1: {case: first, style: "free"}, r2: {case: second, style: "sbar"},
  doc: [], survey: {}
};
try { if (localStorage.getItem("nz_done")) data.repeat = true; } catch(e){}

const app = document.getElementById("app");
const STEP_NAMES = 7; let stepNow = 0;
function steps(n){ stepNow = n; const s = document.getElementById("steps"); s.innerHTML = "";
  for (let i=1;i<=STEP_NAMES;i++){ const b=document.createElement("i"); if(i<=n) b.className="on"; s.appendChild(b);} }
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("show"),2600); }
function el(html){ app.innerHTML = html; window.scrollTo(0,0); const f = app.querySelector("[autofocus]"); if (f) f.focus(); }
let timers = [];
function clearTimers(){ timers.forEach(t=>clearInterval(t)); timers=[]; }
function countdown(sec, barEl, numEl, onEnd){
  const t0 = Date.now();
  const tick = () => {
    const left = Math.max(0, sec - (Date.now()-t0)/1000);
    barEl.firstElementChild.style.transform = `scaleX(${left/sec})`;
    barEl.classList.toggle("hot", left <= 10);
    const m = Math.floor(left/60), s = Math.ceil(left%60);
    numEl.textContent = left >= 60 ? `${m}:${String(Math.floor(left%60)).padStart(2,"0")}` : `${Math.ceil(left)} с`;
    if (left <= 0){ clearTimers(); onEnd(); }
  };
  tick(); timers.push(setInterval(tick, 250));
}
/* без повернення назад */
history.pushState({nz:1}, "");
addEventListener("popstate", () => { history.pushState({nz:1}, ""); toast("Повернутися назад не можна, рухаємося далі"); });
addEventListener("beforeunload", e => { if (stepNow > 0 && stepNow < 7){ e.preventDefault(); e.returnValue=""; } });

function score(caseKey, text){
  const t = (text||"").toLowerCase();
  return CASES[caseKey].facts.map(([name, re]) => re.test(t) ? 1 : 0);
}
function chartHTML(k){
  const c = CASES[k];
  return `<div class="chart" id="chart"><h3>${c.title}</h3><dl>${c.rows.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl><div class="extra">${c.extra}</div></div>`;
}

/* ===================== ЕКРАНИ ===================== */
function intro(){
  steps(0);
  el(`<div class="grow">
    <h1>Нічна зміна</h1>
    <p>Тренажер для дослідження в межах реферату «Інтерпрофесійне та інтрапрофесійне спілкування медичних працівників».</p>
    <p class="muted">Ви побуваєте медсестрою, яка повідомляє черговому лікарю про пацієнта, а потім самим лікарем, який отримує такі повідомлення. Займе близько 10 хвилин.</p>
    <div class="box small">
      <ul class="list">
        <li>Участь анонімна й добровільна, на оцінки не впливає.</li>
        <li>Пацієнти й імена вигадані.</li>
        <li>Будь ласка, не робіть скриншотів і не записуйте картки: дослідження перевіряє саме пам’ять.</li>
        <li>Повернутися на попередній крок не можна.</li>
      </ul>
    </div>
    ${data.repeat ? `<p class="small" style="color:var(--call)">Схоже, ви вже проходили тренажер. Повторне проходження буде позначене і не враховуватиметься в результатах.</p>`:""}
  </div>
  <button class="btn" id="go" autofocus>Погоджуюсь і починаю</button>`);
  document.getElementById("go").onclick = () => roundIntro(1);
}

function roundIntro(n){
  steps(n===1?1:3);
  const sb = n===2;
  el(`<div class="grow">
    <p class="muted">${n===1?"Раунд 1 з 2":"Раунд 2 з 2"} · ви медсестра</p>
    <h2>${n===1?"23:40. Пацієнту стало гірше":"01:15. Ще один дзвінок"}</h2>
    <p>Зараз на екрані з’явиться картка пацієнта. У вас буде <b>${READ_SEC} секунд</b>, щоб її запам’ятати. Потім картка зникне, і ви напишете повідомлення черговому лікарю, як у месенджері.</p>
    ${sb ? `<p>Цього разу пишіть <b>за шаблоном SBAR</b>. Підказка буде над полем для повідомлення.</p>` : `<p>Пишіть так, як написали б у реальному житті. Жодних правил.</p>`}
  </div>
  <button class="btn" id="go" autofocus>Показати картку</button>`);
  document.getElementById("go").onclick = () => readCard(n);
}

function readCard(n){
  const k = n===1 ? first : second;
  el(`<div class="timer"><div class="bar" id="bar"><b></b></div><span class="secs" id="secs"></span></div>
      ${chartHTML(k)}
      <p class="small muted" style="margin-top:14px">Запам’ятайте, що важливо передати лікарю.</p>`);
  countdown(READ_SEC, document.getElementById("bar"), document.getElementById("secs"), () => {
    document.getElementById("chart").classList.add("gone");
    setTimeout(()=>walk(n), 650);
  });
}

function walk(n){
  el(`<div class="walk"><p class="muted">Картку забрали. Ви йдете до поста, щоб написати лікарю…</p>
      <div class="big" id="w">${WALK_SEC}</div></div>`);
  let s = WALK_SEC; const w = document.getElementById("w");
  timers.push(setInterval(()=>{ s--; w.textContent = s; if (s<=0){ clearTimers(); write(n);} }, 1000));
}

function write(n){
  steps(n===1?2:4);
  const sb = n===2, k = n===1 ? first : second;
  el(`<div class="timer"><div class="bar" id="bar"><b></b></div><span class="secs" id="secs"></span></div>
    ${sb ? `<div class="sbar">
        <div class="chip"><b>S</b>Ситуація: хто ви, хто пацієнт, що сталося</div>
        <div class="chip"><b>B</b>Передумови: діагноз, що вже зроблено</div>
        <div class="chip"><b>A</b>Оцінка: показники, ваша думка</div>
        <div class="chip"><b>R</b>Рекомендація: що й до коли зробити</div></div>
        <button class="linkbtn" id="ins">Вставити шаблон S: B: A: R:</button>` : ""}
    <div class="chat"><div class="head"><span class="ava">ЧЛ</span><div><b>Черговий лікар</b><span>в мережі</span></div></div>
      <label for="msg" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Повідомлення лікарю</label>
      <textarea id="msg" placeholder="Напишіть повідомлення лікарю…" autofocus></textarea></div>
    <button class="btn" id="send">Надіслати лікарю</button>
    <p class="small muted" style="margin-top:10px">Коли час закінчиться, повідомлення надішлеться автоматично.</p>`);
  const ta = document.getElementById("msg"), t0 = Date.now();
  let firstKey = null; ta.addEventListener("input", ()=>{ if(firstKey===null) firstKey = Date.now()-t0; }, {once:false});
  ta.addEventListener("paste", e => e.preventDefault());
  if (sb) document.getElementById("ins").onclick = () => {
    if (!ta.value.trim()) ta.value = "S: \nB: \nA: \nR: "; ta.focus(); ta.setSelectionRange(3,3); data.r2.usedInsert = true; };
  let done = false;
  const finish = (auto) => {
    if (done) return; done = true; clearTimers();
    const text = ta.value.trim(), r = n===1 ? data.r1 : data.r2;
    r.text = text; r.ms = Date.now()-t0; r.firstKeyMs = firstKey; r.chars = text.length; r.auto = !!auto;
    r.facts = score(k, text); r.score = r.facts.reduce((a,b)=>a+b,0);
    if (n===1) sbarLearn(); else docIntro();
  };
  document.getElementById("send").onclick = () => {
    if (ta.value.trim().length < 10){ toast("Напишіть хоча б кілька слів"); return; } finish(false); };
  countdown(WRITE_SEC, document.getElementById("bar"), document.getElementById("secs"), () => finish(true));
}

function sbarLearn(){
  const t0 = Date.now();
  el(`<div class="grow">
    <p class="muted">Коротке навчання</p>
    <h2>Шаблон SBAR</h2>
    <p>Так медсестри в багатьох лікарнях світу повідомляють лікарю про пацієнта. Чотири кроки, кожен відповідає на одне запитання.</p>
    <div class="box"><p><b style="color:var(--call)">S – Ситуація.</b> Хто ви, про якого пацієнта, що сталося зараз.</p>
      <p><b style="color:var(--call)">B – Передумови.</b> Діагноз, що вже зроблено.</p>
      <p><b style="color:var(--call)">A – Оцінка.</b> Конкретні показники і ваша думка про стан.</p>
      <p style="margin:0"><b style="color:var(--call)">R – Рекомендація.</b> Що потрібно від лікаря і до коли.</p></div>
    <p class="small muted">Приклад: «Це медсестра хірургії. Пацієнт Іванов, палата 3, кровить пов’язка. Другий день після операції. Тиск 100/60, пульс 104, вважаю, що стан погіршується. Прошу оглянути протягом 10 хвилин».</p>
  </div>
  <button class="btn" id="go" autofocus>Зрозуміло, до раунду 2</button>`);
  document.getElementById("go").onclick = () => { data.learnMs = Date.now()-t0; roundIntro(2); };
}

let docIdx = 0;
function docIntro(){
  steps(5);
  el(`<div class="grow">
    <p class="muted">Частина 2 · ви черговий лікар</p>
    <h2>Тепер ролі змінюються</h2>
    <p>Ви – черговий лікар. Вам приходять два повідомлення від медсестер. Прочитайте кожне і дайте відповідь на кілька запитань.</p>
    <p class="muted">Повідомлення залишатиметься на екрані. Відповідайте так швидко, як зручно, ми рахуємо час.</p>
  </div>
  <button class="btn" id="go" autofocus>Відкрити перше повідомлення</button>`);
  document.getElementById("go").onclick = () => { docIdx = 0; docMsg(); };
}

function docMsg(){
  const key = docOrder[docIdx], d = DOC[key];
  const style = (key==="C") === cFree ? "free" : "sbar";
  const ans = new Array(d.qs.length).fill(null); let clarity = null; const t0 = Date.now();
  el(`<p class="muted">Повідомлення ${docIdx+1} з 2</p>
    <div class="bubble">${d[style].replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}</div>
    <div class="from">${d.nurse} · щойно</div>
    ${d.qs.map((q,i)=>`<p class="q">${q[0]}</p><div class="opts" data-q="${i}">${q[1].map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join("")}</div>`).join("")}
    <p class="q">Наскільки зрозумілим було повідомлення?</p>
    <div class="scale" data-q="c">${[1,2,3,4,5].map(v=>`<button class="opt" data-j="${v}">${v}</button>`).join("")}</div>
    <p class="small muted" style="margin-top:4px">1 – зовсім незрозуміло, 5 – повністю зрозуміло</p>
    <button class="btn" id="go" disabled>${docIdx===0?"Наступне повідомлення":"Далі"}</button>`);
  const go = document.getElementById("go");
  app.querySelectorAll(".opts,.scale").forEach(g => g.addEventListener("click", e => {
    const b = e.target.closest(".opt"); if(!b) return;
    g.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel");
    const q = g.dataset.q, j = +b.dataset.j;
    if (q==="c") clarity = j; else ans[+q] = j;
    go.disabled = !(ans.every(a=>a!==null) && clarity!==null);
  }));
  go.onclick = () => {
    const correct = d.qs.map((q,i)=>{ const c = typeof q[2]==="number" ? q[2] : q[2][style]; return ans[i]===c ? 1 : 0; });
    data.doc.push({msg:key, style, answers:ans, correct, score:correct.reduce((a,b)=>a+b,0), ms:Date.now()-t0, clarity});
    docIdx++; if (docIdx < 2) docMsg(); else survey();
  };
}

function survey(){
  steps(6);
  const Q = [
    ["course","Ваш курс",["1","2","3","4–6","Інше"]],
    ["easierWrite","Як було легше передати інформацію лікарю?",["Без шаблону","За шаблоном SBAR","Однаково"]],
    ["easierRead","Яке повідомлення як лікарю було легше зрозуміти?",["Звичайне","За шаблоном SBAR","Однаково"]],
    ["knewSbar","Чи чули ви про SBAR до цього тренажера?",["Так","Ні"]],
    ["askSenior","Чи наважилися б ви перепитати старшого лікаря, якщо не зрозуміли призначення?",["Так, завжди","Скоріше так","Скоріше ні","Ні"]]
  ];
  el(`<p class="muted">Останній крок</p><h2>Кілька запитань</h2>
    ${Q.map(([k,t,o])=>`<p class="q">${t}</p><div class="opts" data-k="${k}">${o.map(x=>`<button class="opt" data-v="${x}">${x}</button>`).join("")}</div>`).join("")}
    <p class="q">Що заважало найбільше? <span class="muted small">(необов’язково)</span></p>
    <div class="chat" style="margin-top:0"><textarea id="note" style="min-height:90px" placeholder="Наприклад: мало часу, забув цифри…"></textarea></div>
    <button class="btn" id="go" disabled>Завершити й надіслати</button>`);
  const go = document.getElementById("go");
  app.querySelectorAll(".opts").forEach(g => g.addEventListener("click", e => {
    const b = e.target.closest(".opt"); if(!b) return;
    g.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel");
    data.survey[g.dataset.k] = b.dataset.v;
    go.disabled = Q.some(([k])=>!data.survey[k]);
  }));
  go.onclick = () => { data.survey.note = document.getElementById("note").value.trim(); finish(); };
}

function finish(){
  steps(7);
  data.finished = new Date().toISOString();
  try { localStorage.setItem("nz_done", "1"); } catch(e){}
  const json = JSON.stringify(data);
  const configured = CONFIG.formResponseUrl && CONFIG.entryId;
  if (configured){
    const body = new URLSearchParams(); body.append(CONFIG.entryId, json);
    fetch(CONFIG.formResponseUrl, {method:"POST", mode:"no-cors", body}).catch(()=>{});
  }
  const docFree = data.doc.find(d=>d.style==="free"), docSbar = data.doc.find(d=>d.style==="sbar");
  el(`<div class="grow">
    <h1>Зміну завершено</h1>
    <p>${configured ? "Дякуємо! Ваші відповіді надіслано анонімно." : "Дякуємо! Тренажер працює в тестовому режимі: Google-форму ще не підключено."}</p>
    <p class="muted small">Приблизний підсумок (точний підрахунок буде вручну):</p>
    <div class="res">
      <div><b>${data.r1.score} з 8</b><span class="small muted">фактів ви передали без шаблону</span></div>
      <div><b>${data.r2.score} з 8</b><span class="small muted">фактів ви передали за шаблоном SBAR</span></div>
      <div><b>${docFree.score} з 4</b><span class="small muted">правильних відповідей як лікар після звичайного повідомлення</span></div>
      <div><b>${docSbar.score} з 4</b><span class="small muted">правильних відповідей після повідомлення за SBAR</span></div>
    </div>
    <p class="small muted">Код учасника: ${pid}</p>
    ${!configured ? `<button class="btn ghost" id="copy">Скопіювати дані (для перевірки)</button>`:""}
  </div>`);
  const c = document.getElementById("copy");
  if (c) c.onclick = async () => { try{ await navigator.clipboard.writeText(json); toast("Скопійовано"); }catch(e){ toast("Не вдалося скопіювати"); } };
}

intro();
</script>
</body>
</html>
